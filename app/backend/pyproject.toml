[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeh-mcp"
version = "0.1.0"
description = "Agentic Eval Harness over MCP — offline, deterministic planner->executor->critic demo with signed evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sanju Goswami", email = "sanju@forwardai.dev" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["aeh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
